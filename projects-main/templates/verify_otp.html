<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MoneyWise | Verify OTP</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root {
            --accent-gold: #c5a059;
            --gradient:linear-gradient(135deg,#8b5cf6,#22d3ee);
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1f2b, #11141d);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .otp-card {
            width: 420px;
            padding: 45px;
            border-radius: 20px;
            backdrop-filter: blur(15px);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
            animation: fadeUp 0.8s ease-in-out;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .brand {
            text-align: center;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--accent-gold);
            margin-bottom: 10px;
        }

        h4 {
            text-align: center;
            color: white;
            margin-bottom: 10px;
        }

        .sub-text {
            text-align: center;
            color: #aaa;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }

        .otp-inputs {
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        .otp-inputs input {
            width: 50px;
            height: 55px;
            text-align: center;
            font-size: 1.4rem;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2);
            background: transparent;
            color: white;
            transition: 0.3s;
        }

        .otp-inputs input:focus {
            border-color: var(--accent-gold);
            box-shadow: 0 0 12px rgba(197,160,89,0.4);
            outline: none;
        }

        .btn-verify {
            background: linear-gradient(45deg, #c5a059, #e8c47a);
            border: none;
            border-radius: 30px;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-verify:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(197,160,89,0.4);
        }

        .resend {
            text-align: center;
            margin-top: 20px;
            font-size: 0.85rem;
            color: #aaa;
        }

        .resend a {
            color: var(--accent-gold);
            text-decoration: none;
        }

        .resend a:hover {
            text-decoration: underline;
        }
        .stat{
            font-size: 30px;
            margin-bottom: 10px;
            text-align: center;
            font-weight: 700;
            letter-spacing: 2px;
            background: var(--gradient);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body>

<div class="otp-card">

    <div class="brand stat">MONEYWISE</div>
    <h4>Verify Your Email</h4>
    <div class="sub-text">
        Enter the 6-digit code sent to {{ email }}<br>
            </div>

    <form method="POST" action="/verify-otp">

        <div class="otp-inputs">
            <input type="text" maxlength="1" name="otp1" required pattern="[0-9]">
            <input type="text" maxlength="1" name="otp2" required pattern="[0-9]">
            <input type="text" maxlength="1" name="otp3" required pattern="[0-9]">
            <input type="text" maxlength="1" name="otp4" required pattern="[0-9]">
            <input type="text" maxlength="1" name="otp5" required pattern="[0-9]">
            <input type="text" maxlength="1" name="otp6" required pattern="[0-9]">
        </div>

        <button type="submit" class="btn btn-verify w-100 py-2">
            Verify OTP
        </button>

    </form>

    <div class="resend">
        Didn’t receive the code?
        <a href="/resend-otp">Resend OTP</a>
    </div>

</div>

<script>
    const inputs = document.querySelectorAll(".otp-inputs input");

    inputs.forEach((input, index) => {
        input.addEventListener("input", (e) => {
            if (e.target.value.length === 1 && index < inputs.length - 1) {
                inputs[index + 1].focus();
            }
        });

        input.addEventListener("keydown", (e) => {
            if (e.key === "Backspace" && index > 0 && input.value === "") {
                inputs[index - 1].focus();
            }
        });
    });
</script>

</body>
</html>
