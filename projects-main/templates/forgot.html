<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MoneyWise | Forgot Password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root {
            --accent-gold: #c5a059;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1f2b, #11141d);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-box {
            width: 420px;
            padding: 45px;
            border-radius: 20px;
            backdrop-filter: blur(15px);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
            animation: fadeUp 0.8s ease;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .brand {
            text-align: center;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--accent-gold);
            margin-bottom: 10px;
        }

        h4 {
            text-align: center;
            color: white;
            margin-bottom: 10px;
        }

        .sub-text {
            text-align: center;
            color: #aaa;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }

        label {
            color: #ccc;
            font-size: 0.9rem;
        }

        .form-control {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            border-radius: 10px;
        }

        .form-control:focus {
            border-color: var(--accent-gold);
            box-shadow: 0 0 10px rgba(197,160,89,0.4);
            background: transparent;
            color: white;
        }

        .btn-send {
            background: linear-gradient(45deg, #c5a059, #e8c47a);
            border: none;
            border-radius: 30px;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-send:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(197,160,89,0.4);
        }

        .back {
            text-align: center;
            margin-top: 15px;
        }

        .back a {
            color: var(--accent-gold);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="card-box">

    <div class="brand">MONEYWISE</div>
    <h4>Forgot Password</h4>
    <div class="sub-text">
        Enter your registered email.<br>
        We’ll send you a one-time password.
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    {% for category, message in messages %}
    <div class="alert alert-{{ category }} alert-dismissible fade show bg-dark text-white border-info mt-3" role="alert">
        {{ message }}
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
    </div>
    {% endfor %}
    {% endif %}
    {% endwith %}

    <form method="POST" action="/forgot-password" onsubmit="return validateEmail(this.email.value)">

        <div class="mb-3">
            <label>Email Address</label>
            <input type="email" name="email" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-send w-100 py-2">
            Send OTP
        </button>

    </form>

    <div class="back">
        <a href="/login"><i class="fa fa-arrow-left"></i> Back to Login</a>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
function validateEmail(v){
    const pattern = /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/;
    if (!pattern.test(v)) {
        alert("Please enter a valid email address.");
        return false;
    }
    const lower = v.toLowerCase();
    if (!lower.endsWith("@gmail.com") && !lower.endsWith("@yahoo.com")) {
        alert("Email must end with @gmail.com or @yahoo.com.");
        return false;
    }
    return true;
}
</script>

</body>
</html>
