<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MoneyWise | Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root {
            --accent-gold: #c5a059;
            --gradient:linear-gradient(135deg,#8b5cf6,#22d3ee);
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            height: 100vh;
            background: linear-gradient(135deg, #1a1f2b, #11141d);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Animated background glow */
        body::before {
            content: "";
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(197,160,89,0.3), transparent 70%);
            top: -150px;
            right: -150px;
            animation: pulse 6s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.2); opacity: 0.3; }
            100% { transform: scale(1); opacity: 0.6; }
        }

        .login-card {
            position: relative;
            width: 400px;
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(15px);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
            animation: fadeUp 1s ease-in-out;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-card h3 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .form-control {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            border-radius: 10px;
        }

        .form-control:focus {
            border-color: var(--accent-gold);
            box-shadow: 0 0 10px rgba(197,160,89,0.4);
            background: transparent;
            color: white;
        }

        label {
            color: #ccc;
            font-size: 0.9rem;
        }

        .btn-login {
            background: linear-gradient(45deg, #c5a059, #e8c47a);
            border: none;
            border-radius: 30px;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-login:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(197,160,89,0.4);
        }

        .text-link {
            color: #aaa;
            font-size: 0.9rem;
        }

        .text-link a {
            color: var(--accent-gold);
            text-decoration: none;
        }

        .text-link a:hover {
            text-decoration: underline;
        }

        .brand {
            text-align: center;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--accent-gold);
            margin-bottom: 10px;
        }
        .stat{
            font-size: 30px;
            text-align: center;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 10px;
            background: var(--gradient);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body>

<div class="login-card">

    <div class=" stat">MONEYWISE</div>
    <h3>Welcome Back 👋</h3>

    <form method="POST" action="/login" onsubmit="return validateEmail(this.email.value)">

        <div class="mb-3">
            <label>Email Address</label>
            <input type="email" name="email" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <input type="checkbox"> <span class="text-link">Remember me</span>
            </div>
            <a href="/forgot-password" class="text-link">Forgot Password?</a>
        </div>

        <button type="submit" class="btn btn-login w-100 py-2">
            Login
        </button>

    </form>

    <div class="text-center mt-4 text-link">
        Don't have an account?
        <a href="/signup">Register</a>
    </div>

</div>

<script>
function validateEmail(v){return /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/.test(v)}
</script>

</body>
</html>
