<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MoneyWise | Create Password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root {
            --accent-gold: #c5a059;
            --gradient:linear-gradient(135deg,#8b5cf6,#22d3ee);
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1f2b, #11141d);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Animated Glow */
        body::before {
            content: "";
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(197,160,89,0.25), transparent 70%);
            top: -150px;
            right: -150px;
            animation: pulse 6s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.2); opacity: 0.3; }
            100% { transform: scale(1); opacity: 0.6; }
        }

        .password-card {
            position: relative;
            width: 420px;
            padding: 45px;
            border-radius: 20px;
            backdrop-filter: blur(15px);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
            animation: fadeUp 1s ease-in-out;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .brand {
            text-align: center;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--accent-gold);
            margin-bottom: 10px;
        }

        .password-card h3 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .form-control {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            border-radius: 10px;
        }

        .form-control:focus {
            border-color: var(--accent-gold);
            box-shadow: 0 0 10px rgba(197,160,89,0.4);
            background: transparent;
            color: white;
        }

        label {
            color: #ccc;
            font-size: 0.9rem;
        }

        .btn-create {
            background: linear-gradient(45deg, #c5a059, #e8c47a);
            border: none;
            border-radius: 30px;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-create:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(197,160,89,0.4);
        }

        .password-toggle {
            position: absolute;
            right: 15px;
            top: 38px;
            cursor: pointer;
            color: #aaa;
        }

        .text-muted {
            font-size: 0.85rem;
            color: #aaa !important;
        }
        .stat{
            font-size: 30px;
            font-weight: 700;
            background: var(--gradient);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body>

<div class="password-card">

    <div class=" stat text-center">MONEYWISE</div>
    <h3>Create Your Password 🔐</h3>

    <form method="POST" action="/create-password" onsubmit="return validatePassword()">

        <!-- Password -->
        <div class="mb-3 position-relative">
            <label>New Password</label>
            <input type="password" id="password" name="password" class="form-control" required>
            <i class="fa fa-eye password-toggle" onclick="togglePassword('password', this)"></i>
        </div>

        <!-- Confirm Password -->
        <div class="mb-3 position-relative">
            <label>Confirm Password</label>
            <input type="password" id="confirm_password" class="form-control" required>
            <i class="fa fa-eye password-toggle" onclick="togglePassword('confirm_password', this)"></i>
        </div>

        <div class="text-muted mb-3">
            Password must have at least 1 uppercase letter, 1 digit, 1 special character, and no spaces.
        </div>

        <button type="submit" class="btn btn-create w-100 py-2">
            Create Account
        </button>

    </form>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
function togglePassword(fieldId, icon) {
    const field = document.getElementById(fieldId);
    if (field.type === "password") {
        field.type = "text";
        icon.classList.replace("fa-eye", "fa-eye-slash");
    } else {
        field.type = "password";
        icon.classList.replace("fa-eye-slash", "fa-eye");
    }
}

function validatePassword() {
    const pass = document.getElementById("password").value;
    const confirm = document.getElementById("confirm_password").value;

    const hasUpper = /[A-Z]/.test(pass);
    const hasDigit = /\d/.test(pass);
    const hasSpecial = /[^\w]/.test(pass);
    const hasSpace = /\s/.test(pass);

    if (hasSpace || !hasUpper || !hasDigit || !hasSpecial) {
        alert("Password must have at least 1 uppercase letter, 1 digit, 1 special character, and no spaces.");
        return false;
    }

    if (pass !== confirm) {
        alert("Passwords do not match.");
        return false;
    }

    return true;
}
</script>

</body>
</html>
