<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>MoneyWise | Settings</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #141821;
            --sidebar-dark: #1c2230;
            --card-dark: #232b3b;
            --accent-gold: #c5a059;
            --accent-green: #28c76f;
            --accent-red: #ea5455;
            --text-muted: #9aa4b2;
            --accent-blue: #3d8bfd;
            --gradient: linear-gradient(135deg, #8b5cf6, #22d3ee);
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: var(--bg-dark);
            color: white;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            width: 230px;
            height: 100vh;
            background: var(--sidebar-dark);
            padding: 30px 20px;
        }

        

        .sidebar a {
            display: block;
            color: var(--text-muted);
            text-decoration: none;
            margin-bottom: 20px;
            transition: 0.3s;
            padding: 8px;
            border-radius: 5px;
        }

        .sidebar a.active {
            color: white;
            border-left: 3px solid var(--accent-blue);
            background: rgba(61, 139, 253, 0.1);
        }

        .sidebar a:hover {
            color: var(--accent-gold);
            transform: translateX(5px);
        }

        /* Main */
        .main {
            margin-left: 230px;
            padding: 40px;
        }

        .settings-card {
            background: var(--card-dark);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
            transition: 0.3s ease;
        }

        .settings-card:hover {
            transform: translateY(-5px);
        }

        .settings-card h5 {
            margin-bottom: 20px;
            font-weight: 600;
            color: var(--accent-gold);
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .label-text {
            color: var(--text-muted);
        }

        .btn-gold {
            background: var(--accent-gold);
            border: none;
            color: black;
            font-weight: 600;
        }

        .btn-gold:hover {
            opacity: 0.9;
        }

        .btn-danger-custom {
            background: var(--accent-red);
            border: none;
        }

        .modal-content {
            background: var(--card-dark);
            color: white;
            border-radius: 20px;
        }

        .form-control {
            background: #1c2230;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
        }

        .form-control:focus {
            background: #1c2230;
            color: white;
            border-color: var(--accent-gold);
            box-shadow: none;
        }

        .stat {
            font-size: 30px;
            font-weight: 700;
            background: var(--gradient);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientMove 3s infinite alternate;
        }

        @keyframes gradientMove {
            from {
                background-position: left;
            }

            to {
                background-position: right;
            }
        }
    </style>
</head>

<body>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <a class="stat" href="/dashboard">MONEYWISE</a>
        <a href="/dashboard"><i class="fa fa-home me-2"></i>Dashboard</a>
        <a href="/income"><i class="fa fa-wallet me-2"></i>Income</a>
        <a href="/assets"><i class="fa fa-piggy-bank me-2"></i>Assets</a>
        <a href="/expenses"><i class="fa fa-receipt me-2"></i>Expenses</a>
        <a href="/goals" ><i class="fa fa-bullseye me-2"></i>Goals</a>
        <a href="/recurring" ><i class="fa fa-calendar-check me-2"></i>Bills & EMIs</a>
        <a href="/budget"><i class="fa fa-chart-pie me-2"></i>Budget</a>
        <a href="/settings" class="active"><i class="fa fa-cog me-2"></i>Settings</a>
    </div>

    <!-- MAIN -->
    <div class="main">

        <h2 class="mb-4">Settings</h2>

        <!-- PROFILE SECTION -->
        <div class="settings-card">
            <h5><i class="fa fa-user me-2"></i>Profile</h5>

            <div class="info-row">
                <span class="label-text">First Name</span>
                <strong>{{ user.first_name }}</strong>
            </div>

            <div class="info-row">
                <span class="label-text">Last Name</span>
                <strong>{{ user.last_name }}</strong>
            </div>

            <div class="info-row">
                <span class="label-text">Email</span>
                <strong>{{ user.email }}</strong>
            </div>

            <div class="mt-3 text-end">
                <button class="btn btn-gold btn-sm" data-bs-toggle="modal" data-bs-target="#editProfileModal">
                    Edit Profile
                </button>
            </div>
        </div>

        <!-- SECURITY -->
        <div class="settings-card">
            <h5><i class="fa fa-shield-halved me-2"></i>Security</h5>

            <button class="btn btn-outline-light btn-sm" data-bs-toggle="modal" data-bs-target="#changePasswordModal">
                Change Password
            </button>

            <div class="mt-3">
                <a href="/logout" class="btn btn-danger-custom btn-sm">
                    Logout All Devices
                </a>
            </div>
        </div>

        <!-- ACCOUNT -->
        <div class="settings-card">
            <h5><i class="fa fa-database me-2"></i>Account Management</h5>

            <button class="btn btn-danger-custom btn-sm" onclick="confirmDeleteAccount()">
                Delete Account Permanently
            </button>
        </div>

    </div>

    <!-- Edit Profile Modal -->
    <div class="modal fade" id="editProfileModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="background:#232a3b;color:white;border-radius:12px;">
                <form method="POST" action="/settings">
                    <div class="modal-header border-0">
                        <h5 class="modal-title">Edit Profile</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>

                    <input type="hidden" name="action" value="update_profile">

                    <div class="modal-body">
                        <div class="mb-3">
                            <label>First Name</label>
                            <input type="text" name="first_name" class="form-control" value="{{ user.first_name }}"
                                pattern="^[A-Za-z]{2,30}$" title="Only letters allowed (2-30 characters)" required>
                        </div>

                        <div class="mb-3">
                            <label>Last Name</label>
                            <input type="text" name="last_name" class="form-control" value="{{ user.last_name }}"
                                pattern="^[A-Za-z]{2,30}$" title="Only letters allowed (2-30 characters)" required>
                        </div>
                    </div>

                    <div class="modal-footer border-0">
                        <button type="submit" class="btn btn-outline-warning">Save</button>
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>


    <div class="modal fade" id="changePasswordModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="background:#232a3b;color:white;border-radius:12px;">
                <form method="POST" action="/settings" onsubmit="return validatePassword()">

                    <div class="modal-header border-0">
                        <h5 class="modal-title">Change Password</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>

                    <input type="hidden" name="action" value="change_password">

                    <div class="modal-body">

                        <div class="mb-3">
                            <label>Current Password</label>
                            <input type="password" name="current_password" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label>New Password</label>
                            <input type="password" name="new_password" id="new_password" class="form-control"
                                pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}$"
                                title="Minimum 8 characters, include uppercase, lowercase, number and special character"
                                required>
                        </div>

                        <div class="mb-3">
                            <label>Confirm Password</label>
                            <input type="password" id="confirm_password" class="form-control" required>
                        </div>

                    </div>

                    <div class="modal-footer border-0">
                        <button type="submit" class="btn btn-outline-warning">Update</button>
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>


    <!-- JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        function confirmDeleteAccount() {
            if (!confirm("⚠️ This will permanently delete your account and all data. Are you sure?")) return;

            const form = document.createElement("form");
            form.method = "POST";
            form.action = "/settings";

            const input = document.createElement("input");
            input.type = "hidden";
            input.name = "action";
            input.value = "delete_account";

            form.appendChild(input);
            document.body.appendChild(form);
            form.submit();
        }
        function validatePassword() {
            const pass = document.getElementById("new_password").value;
            const confirmPass = document.getElementById("confirm_password").value;

            const hasUpper = /[A-Z]/.test(pass);
            const hasDigit = /\d/.test(pass);
            const hasSpecial = /[^\w]/.test(pass);
            const hasSpace = /\s/.test(pass);

            if (hasSpace || !hasUpper || !hasDigit || !hasSpecial) {
                alert("Password must have at least 1 uppercase letter, 1 digit, 1 special character, and no spaces.");
                return false;
            }

            if (pass !== confirmPass) {
                alert("Passwords do not match!");
                return false;
            }
            return true;
        }
    </script>
    <script>
        function capFirstAlpha(s){const i=s.search(/[A-Za-z]/);return i===-1?s:s.slice(0,i)+s.charAt(i).toUpperCase()+s.slice(i+1)}
        document.addEventListener("input",function(e){const el=e.target;if(el.matches(".modal input[type='text']")){el.value=capFirstAlpha(el.value)}})
        document.addEventListener("blur",function(e){const el=e.target;if(el.matches(".modal input[type='text']")){el.value=capFirstAlpha(el.value)}},true)
    </script>

</body>

</html>
